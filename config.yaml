# 과자 옮기기 로봇 설정. 설계: docs/superpowers/specs/2026-10-22-chat-ui-design.md
# API 키는 .env에 (.env.example 참고). 이 파일에는 키를 쓰지 않는다.

target:
  name: 오란다
  robot_name: 보리          # 캐릭터 이름
  initial_count: 3          # B단계: 채팅에 개수가 없을 때

decision:
  refuse: half              # half: 전체의 절반(올림)을 옮기면 작업당 한 번 거부 (전체 2개 이하는 거부 없음, 달래면 끝까지)
                            # fixed: 아래 고정 임계값 (safe_max 이하 일함, force_refuse 이상 거부, 사이는 LLM)
  safe_max: 3               # fixed 모드: 이하면 무조건 일함
  force_refuse: 6           # fixed 모드: 이상이면 무조건 거부
  max_retry: 1              # 옮기기 실패 시 재시도 횟수 (1 = 두 번 연속 놓치면 투덜대고 도리도리 → 진행자 확인 대기)

providers:                  # 접속 정보만. 어떤 모델을 쓸지는 각 역할의 chain에서 고른다.
  openrouter: {type: openai_compat, base_url: "https://openrouter.ai/api/v1", api_key_env: OPENROUTER_API_KEY}
  nvidia:     {type: openai_compat, base_url: "https://integrate.api.nvidia.com/v1", api_key_env: NVIDIA_API_KEY}
  openai:     {type: openai_compat, base_url: "https://api.openai.com/v1", api_key_env: OPENAI_API_KEY}
  gemini:     {type: openai_compat, base_url: "https://generativelanguage.googleapis.com/v1beta/openai", api_key_env: GEMINI_API_KEY, native_base_url: "https://generativelanguage.googleapis.com/v1beta"}
  anthropic:  {type: anthropic, api_key_env: ANTHROPIC_API_KEY}
  ollama:     {type: openai_compat, base_url: "http://localhost:11434/v1"}
  local_ov:   {type: openvino}

brain:
  max_say_len: 80
  max_tokens: 1024
  memory_turns: 12          # LLM에 넘길 최근 대화 메시지 수
  # 위에서부터 시도, 전부 실패하면 규칙. 비우면 규칙만.
  # NVIDIA 추론 모델은 생각을 끄지 않으면 8초를 넘겨 규칙으로 떨어진다 (extra_body로 끈다).
  chain:
    - {provider: anthropic, model: "claude-opus-5-5", effort: low, timeout_s: 8}
    - {provider: nvidia, model: "nvidia/nemotron-3.5-lightning-30b-a3b", timeout_s: 8, extra_body: {chat_template_kwargs: {enable_thinking: false}}}
  # chain:
  #   - {provider: gemini, model: "[모델 ID]", timeout_s: 5}
  #   - {provider: openrouter, model: "[모델 ID]", timeout_s: 5}
  #   - {provider: anthropic, model: "claude-opus-5-5", effort: low, timeout_s: 8}
  #   - {provider: local_ov, model_dir: "models/llm", device: GPU, kind: llm}

vision:
  camera: tower cam
  frames: 5          # 한 번 셀 때 읽는 프레임 수 (개수의 중앙값을 쓴다, 깜빡임 제거). 흔들리면 7로
  frame_gap_s: 0.1   # 프레임 사이 간격(초)
  confirm_s: 0.7     # 놓았는데 개수가 안 줄었을 때 다시 세기 전에 기다리는 시간(초): 카메라에 놓은 과자가 안정되게
  # 위에서부터 시도. 비우면 B단계 (시작 개수 + 그리퍼 판정). 화면 토글(끔·OpenCV)로 하나만 고를 수도 있다.
  # OpenCV roi = 검은 매트 영역 [x1, y1, x2, y2] (가로·세로 비율). 2026-10-23 노트북 tower cam 기준이다.
  # 카메라나 트레이 위치가 바뀌면 python -m snackbot.vision <사진> --blobs 로 다시 맞춘다 (docs/DEMO_RUNBOOK.md).
  chain:
    # 오란다 색 화소만 (H 5~21, S≥80): 붙어 있는 초코송이(초록 갓·밝은 기둥)·노란 볼과 한 덩어리로 묶이지 않게 (2026-10-23 실기에서 3개→2개 오판)
    - {type: opencv, roi: [0.289, 0.208, 0.617, 0.847], hsv_low: [5, 80, 90], hsv_high: [21, 255, 255], max_hue: 21, min_area: 600, unit_area: 1700}
  #   - {type: vlm, provider: local_ov, model_dir: "models/vlm", device: GPU, kind: vlm, prompt: "How many [오란다 생김새] are in the tray? Answer with a number only."}
  #   - {type: yolo, model_dir: "models/oranda_world_openvino_model", conf: 0.35, device: "intel:gpu"}
  #   - {type: fake}        # dry-run에서 A단계 흐름 확인용

stt:
  chain:
    # device를 GPU로 바꾸면 label도 같이 바꾼다 (UI 모델 정보에 표시됨)
    - {provider: local_ov, kind: whisper, model_dir: "models/whisper-small", device: CPU, language: ko,
       cache_dir: "models/ov_cache", label: "Whisper small · OpenVINO · CPU"}
    - {provider: gemini, model: "gemini-3.5-flash-lite", transcribe: chat, timeout_s: 15}   # 크레딧 있을 때 예비
  #  - {provider: openai, model: "gpt-4o-mini-transcribe", timeout_s: 15}   # 키가 정상일 때의 백업

robot:
  # 시연 노트북은 Windows. 팔로워 = COM5 (CH343 시리얼 5B90101274), 리더 = COM6 (5B79080541) — 2026-10-23 서보 레지스터·토크 상태로 판별.
  # Windows는 같은 USB 어댑터에 같은 COM 번호를 준다. Ubuntu라면 ls -l /dev/serial/by-id/ 경로를 쓴다 (Studio PC는 팔로워 ACM1, 리더 ACM0)
  port: COM5                               # Windows 노트북 (지금 쓰는 값)
  # port: /dev/serial/by-id/usb-1a86_USB_Single_Serial_5B90101274-if00-port0   # Ubuntu: ls -l /dev/serial/by-id/ 에서 팔로워 경로로 바꾼다 (이름은 예시)
  calibration: calibration/follower.yaml   # Studio에서 받는다 — Windows: .venv\Scripts\python -m tools.fetch_calibration ... / Ubuntu: .venv/bin/python -m tools.fetch_calibration ... (파일 머리말 참고)

cameras:                                   # 키 = 학습 때 카메라 이름 (정책 입력 images.<이름>). 정책이 쓰는 카메라를 모두 둔다
  # device: 번호(0 → /dev/video0) 또는 {serial: "..."} (USB를 다시 꽂아도 같은 장치). python -m tools.cameras 로 확인
  # 시연 노트북(Windows, 2026-10-23): 0 = 노트북 내장 카메라(쓰지 않음), 1 = icspring(손목), 2 = USB_Camera(위에서 보는 화면).
  # Windows 장치 정보에는 시리얼이 없어 번호로 지정한다. 카메라를 더 꽂거나 USB를 바꿔 꽂으면 python -m tools.cameras 로 다시 확인
  tower cam:  {device: 2, width: 1280, height: 720, fps: 30}   # oranda 학습 이름 a
  side cam:   {device: 3, width: 1280, height: 720, fps: 30}   # 트레이 맞은편. oranda 학습 이름 b (tower와 시리얼이 같아 Windows가 포트 기준 ID를 준다)
  follow cam: {device: 1, width: 1280, height: 720, fps: 30}   # 손목. oranda 학습 이름 follow
  # Ubuntu (Studio PC 기준 runtime-config, 2026-10-23) — 위 세 줄 대신 쓴다. 번호는 Ubuntu에서 tools.cameras로 다시 확인:
  #   .venv/bin/python -m tools.cameras
  # tower cam:  {device: 0, width: 1280, height: 720, fps: 30}                           # a (tower·side는 시리얼이 같아 번호로)
  # side cam:   {device: 4, width: 1280, height: 720, fps: 30}                           # b
  # follow cam: {device: {serial: "20240307110322"}, width: 1280, height: 720, fps: 30}  # 손목, 시리얼 고유
  # (Windows: .venv\Scripts\python -m tools.cameras)

skills:
  fps: 30
  device: CPU                              # CPU | GPU | NPU. 이 노트북 GPU는 모델마다 컴파일 55~65초(시작 2분), CPU는 로드 6초·추론 0.14~0.23초/청크
  # camera_map: 학습 때 Studio 카메라 이름이 위 cameras 키와 다르면 {학습 이름: config 이름}.
  #   학습 이름은 결과물 manifest.json의 "images.<이름>"에서 확인한다. 예: {A: tower cam, B: side cam}
  # replay: dry-run 재생에 쓸 Studio 녹화 {dataset: <데이터셋 id>, episode: <번호>} (python -m tools.fetch_replays 가 읽는다)
  oranda_pickup:                           # 학습 데이터: Studio 프로젝트 oranda, 데이터셋 last (31 에피소드, 5~18초)
    export_dir: traind-model/pickup/exports/openvino
    max_time_s: 20
    camera_map: {a: tower cam, b: side cam, follow: follow cam}
    replay: {dataset: 2fad5952-320a-42e2-b2a1-73e367f64e82, episode: 0}
  dori_dori:
    export_dir: traind-model/dori-dori-model/exports/openvino
    max_time_s: 6
    camera_map: {}
    replay: {dataset: 83f518ed-2d84-4807-ae01-5d7cf1904ea6, episode: 0}   # dori_dori_4
    source: script                         # auto | policy | script. 2026-10-23 실기: 모델은 몸통을 ±1밖에 안 흔들어 거부·버튼·채팅 도리도리 모두 코드 동작으로
    script: {joint: shoulder_pan, amplitude: 15, shakes: 2, shake_s: 0.35}   # 코드 도리도리: 홈 기준 joint만 ±amplitude(최대 30)를 shakes번, 한쪽 shake_s초
  # 아래 값은 oranda 데이터셋(31 에피소드)에서 정했다. 홈·빈손 닫힘 50, 과자 쥠 54~56, 벌림 56~64로 폭이 좁다.
  # 실기 robot_probe watch (2026-10-23, COM5): 빈손 닫힘 49.4~50.1, 손으로 오란다 쥠 54.2~55.4, 끝까지 벌림 79.0 → 값 유지
  gripper:                                 # 0..100, 작을수록 닫힘 (데이터로 확인)
    closed_below: 56.0                     # 이보다 작으면 "닫힘"
    open_above: 56.5                       # 닫힘 뒤 이보다 큰 값이 open_hold_s 동안 이어지면 "놓음" → ACT 정지
    grasp_min: 52                          # 닫힘 구간 최솟값이 이 이상이면 과자를 쥔 것 (빈 그리퍼는 50까지 닫힌다)
    open_hold_s: 0.15                      # 녹화에서 놓는 순간 벌림이 짧다 (이 값들로 31개 중 23개가 놓는 순간 정지, 조기 정지 0)
  home_tolerance: 5                        # 관절별 오차가 이보다 크면 스킬 전에 home_pose로 이동
  move_s: 2.0                              # 자세 하나로 이동하는 시간 (초)

poses_file: poses.yaml                     # python -m tools.robot_probe save home | save lift 가 기록

ui:
  tiles: [tower cam, side cam, follow cam, twin]   # 2×2 칸 순서. 각 칸: config 카메라 이름 | twin | {iframe: URL, name: 이름표}

twin:                                     # 3D 디지털 트윈 (frontend/twin.js)
  urdf: twin/so101/so101_new_calib.urdf   # frontend/ 기준 경로 (정적 서빙)
  rate_hz: 15                             # 실제 로봇 관절값 전송 주기 (값이 바뀔 때만 보낸다)
  sign: [1, 1, 1, 1, 1, 1]                # [ ] 관절별 부호 보정: 3D가 실제와 반대로 돌면 -1
  offset_deg: [0, 0, 0, 0, 0, 0]          # [ ] 관절별 영점 보정 (도)

replays_dir: replays                      # git 제외. replays/<스킬>/episode.json (tools.fetch_replays 또는 실행 기록 복사)

recording:                                # 실행 기록: 실제 로봇에서 정책 phase마다 관절값·프레임 저장 (episode.json 형식)
  enabled: true
  dir: logs/runs                          # git 제외 (logs/*)
  frame_fps: 10
  frame_width: 640

voice:
  engine: gemini            # none | log | pyttsx3 | openai | gemini
  provider: gemini          # providers의 접속 정보(키·base_url / gemini는 native_base_url)
  model: gemini-2.5-flash-preview-tts
  voice: Leda               # 어리고 밝은 목소리
  instructions: "귀엽고 금방 지치는 투덜이 로봇 보리처럼 짧고 또박또박 말해:"
  timeout_s: 20
  sync_timeout_s: 10        # 대사 소리가 시작될 때까지 동작을 기다리는 최대 시간 (TTS 실패·지연 시 그냥 시작)
  # 예비 음성 (Windows만): Gemini가 실패하면 Windows 내장 한국어 음성으로 대신 말한다. 한도 오류(429 등) 뒤에는
  # fallback_cooldown_s 동안 Gemini를 건너뛴다. Ubuntu에서는 무시된다 (소리 없이 진행)
  fallback: windows         # windows | (비우면 예비 없음)
  fallback_voice: Microsoft Heami Desktop
  fallback_rate: 1          # -10(느림) ~ 10(빠름)
  fallback_cooldown_s: 600
  fallback_error_cooldown_s: 60   # 시간 초과·연결 오류 뒤 API를 건너뛰는 시간(초): 문장마다 timeout을 기다리지 않게

dry_run:
  act_s: 1.0                # 스킬 하나에 걸리는 가짜 시간 (초)
  fail_rate: 0.0            # 옮기기 실패 확률 (재시도 흐름 확인용)
  samples_dir: tests/samples   # tray_N.jpg가 있으면 그 사진, 없으면 합성 이미지
  seed: null

server:
  host: 127.0.0.1
  port: 8000

logging:
  dir: logs
